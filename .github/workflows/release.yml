# Builds the ISO from scratch on a tag v<NIRINTU_VERSION> and publishes a source release with the
# package manifest and the component commits. The ISO itself is not attached (GitHub limits release
# assets to 2 GiB). workflow_dispatch runs the same build without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Check the version against the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source config.env
          [ "$GITHUB_REF_NAME" = "v$NIRINTU_VERSION" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match NIRINTU_VERSION=$NIRINTU_VERSION"; exit 1; }
          grep -q "^## $NIRINTU_VERSION" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $NIRINTU_VERSION"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/nirintu
          sudo chown "$(id -u):$(id -g)" /mnt/nirintu
          echo 'WORKDIR="/mnt/nirintu"' > config.local.env
          df -h / /mnt

      - name: Build
        run: ./build.sh all

      - name: Collect release files
        run: |
          source config.env
          mkdir dist
          cp /mnt/nirintu/out/*.manifest "dist/nirintu-$NIRINTU_VERSION-packages.manifest"
          cp /mnt/nirintu/debs/SOURCES "dist/nirintu-$NIRINTU_VERSION-sources.txt"
          sed -n "/^## $NIRINTU_VERSION/,/^## /{/^## /!p}" CHANGELOG.md > dist/notes.md
          ls -l dist /mnt/nirintu/out

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: nirintu-build-files
          path: dist/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source config.env
          gh release create "$GITHUB_REF_NAME" \
            --title "Nirintu $NIRINTU_VERSION" \
            --notes-file dist/notes.md \
            "dist/nirintu-$NIRINTU_VERSION-packages.manifest" \
            "dist/nirintu-$NIRINTU_VERSION-sources.txt"
