# Calamares for the Nirintu live ISO. Based on calamares-settings-lubuntu (noble).
---
modules-search: [ local ]

instances:
- id: bios_grub
  module: contextualprocess
  config: bios_grub_context.conf
- id: grub_theme
  module: shellprocess
  config: shellprocess_grub_theme.conf
- id: finish
  module: shellprocess
  config: shellprocess_finish.conf
- id: logs
  module: shellprocess
  config: shellprocess_logs.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - networkcfg
  - hwclock
  - packages
  - initramfscfg
  - initramfs
  - grubcfg
  - contextualprocess@bios_grub
  - shellprocess@grub_theme
  - bootloader
  - shellprocess@finish
  - shellprocess@logs
  - umount
- show:
  - finished

branding: nirintu
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
