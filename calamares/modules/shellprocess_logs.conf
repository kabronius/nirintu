---
dontChroot: true
timeout: 30
script:
    - "-mkdir -p ${ROOT}/var/log/installer"
    - "-cp /root/.cache/calamares/session.log ${ROOT}/var/log/installer/calamares.log"
    - "-cp /var/log/casper.log ${ROOT}/var/log/installer/casper.log"
    - "-cp /cdrom/.disk/info ${ROOT}/var/log/installer/media-info"
    - "-chmod 600 ${ROOT}/var/log/installer/calamares.log ${ROOT}/var/log/installer/casper.log"
